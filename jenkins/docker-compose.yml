name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: jenkins-controller:local
    restart: unless-stopped
    env_file: .env                 
    ports:
      - "127.0.0.1:8081:8080"      
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 1536m              
  agent-backend:
    build: ./agent-backend
    image: jenkins-agent-backend:local
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBKEY:?set AGENT_SSH_PUBKEY in jenkins/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_backend_ssh:/etc/ssh   
      - maven_repo:/home/jenkins/.m2 
    mem_limit: 3g

  agent-frontend:
    build: ./agent-frontend
    image: jenkins-agent-frontend:local
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBKEY:?set AGENT_SSH_PUBKEY in jenkins/.env}
    volumes:
      - agent_frontend_ssh:/etc/ssh
      - npm_cache:/home/jenkins/.npm
    mem_limit: 2g

  # Throwaway MongoDB for the backend tests (reached as mongo-test:27017).
  # Data lives in RAM and disappears on restart.
  mongo-test:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    tmpfs:
      - /data/db
    mem_limit: 768m

  sonar-db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in jenkins/.env}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.5.0.122743-community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in jenkins/.env}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ports:
      - "${SONAR_PORT:-9000}:9000"
    mem_limit: 4g
    restart: unless-stopped

volumes:
  jenkins_home:
  agent_backend_ssh:
  agent_frontend_ssh:
  maven_repo:
  npm_cache:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs: