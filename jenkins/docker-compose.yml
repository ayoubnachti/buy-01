name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: jenkins-controller:local
    restart: unless-stopped
    env_file: .env                 
    ports:
      - "127.0.0.1:8081:8080"      
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 1536m              

volumes:
  jenkins_home:
