name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: jenkins-controller:local
    restart: unless-stopped
    env_file: .env                 
    ports:
      - "127.0.0.1:8081:8080"      
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 1536m              
  agent-backend:
    build: ./agent-backend
    image: jenkins-agent-backend:local
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBKEY:?set AGENT_SSH_PUBKEY in jenkins/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_backend_ssh:/etc/ssh   
      - maven_repo:/home/jenkins/.m2 
    mem_limit: 3g

  agent-frontend:
    build: ./agent-frontend
    image: jenkins-agent-frontend:local
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${AGENT_SSH_PUBKEY:?set AGENT_SSH_PUBKEY in jenkins/.env}
    volumes:
      - agent_frontend_ssh:/etc/ssh
      - npm_cache:/home/jenkins/.npm
    mem_limit: 2g

volumes:
  jenkins_home:
  agent_backend_ssh:
  agent_frontend_ssh:
  maven_repo:
  npm_cache: