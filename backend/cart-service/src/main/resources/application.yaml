server:
  port: 8085

spring:
  application:
    name: cart-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/orders_db}
    auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: "health"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true