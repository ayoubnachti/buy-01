server:
  port: 8084

spring:
  application:
    name: order-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/orders_db}
  cloud:
    loadbalancer:
      cache:
        ttl: 5s

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,info"

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      mediaService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
      productService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        # Business answers (not outages) must not open the circuit.
        ignoreExceptions:
          - com.ecommerce.orderservice.exceptions.orderExceptions.OutOfStockException
          - com.ecommerce.orderservice.exceptions.orderExceptions.ProductNotFoundException