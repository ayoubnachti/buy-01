server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;

  # Media uploads go through here (the gateway accepts up to 15 MB)
  client_max_body_size 15m;

  # API calls: the browser calls /api/... on the same domain as the site,
  # nginx strips /api and forwards to the gateway inside the Docker network.
  location /api/ {
    proxy_pass https://api-gateway:8443/;   # trailing slash = strip /api
    proxy_set_header Origin "";            # same-origin for the browser: don't let the gateway treat it as CORS
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths go to index.html, Angular's router takes over
  location / {
    try_files $uri $uri/ /index.html;
  }
}