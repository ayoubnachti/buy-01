<header>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand order-1" routerLink="/">Buy-01</a>
      <div class="order-2 order-lg-3 ms-lg-auto">
        @if (!isLoggedIn()) {
          <a class="btn btn-outline-primary btn-sm" routerLink="/login">Log in</a>
        } @else {
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
            Logout
          </button>
        }
      </div>

      <hr class="w-100 order-3 d-lg-none my-2" />
      <ul class="navbar-nav flex-row gap-3 order-4 order-lg-2 w-100 w-lg-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>
        </li>
        @if (isSeller()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/seller/dashboard" routerLinkActive="active">
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" routerLinkActive="active">
              Profile
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
