# The e-commerce stack: used by the pipeline to deploy, and for local runs.
# Images are tagged ${TAG}: the build number in the pipeline, "dev" locally.
# Every service has a healthcheck, so `docker compose up --wait` only succeeds
# when the whole stack is healthy (the pipeline relies on that).
services:

  discovery-server:
    build: ./backend/discovery-server
    image: ecommerce/discovery-server:${TAG:-dev}
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  user-service:
    build: ./backend/user-service
    image: ecommerce/user-service:${TAG:-dev}
    container_name: user-service
    restart: unless-stopped
    environment:
      - MONGODB_URI=${USER_MONGODB_URI}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  product-service:
    build: ./backend/product-service
    image: ecommerce/product-service:${TAG:-dev}
    container_name: product-service
    restart: unless-stopped
    environment:
      - MONGODB_URI=${PRODUCT_MONGODB_URI}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  media-service:
    build: ./backend/media-service
    image: ecommerce/media-service:${TAG:-dev}
    container_name: media-service
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MEDIA_MONGODB_URI}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  api-gateway:
    build: ./backend/api-gateway
    image: ecommerce/api-gateway:${TAG:-dev}
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      - JWT_SECRET=${JWT_SECRET}
      - SSL_KEYSTORE_PATH=${SSL_KEYSTORE_PATH}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost:8443/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Production build of the Angular app, served by nginx.
  # For live reload while coding, run `npm start` in frontend/ instead.
  frontend:
    build: ./frontend
    image: ecommerce/frontend:${TAG:-dev}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  default:
    name: ecommerce-network