name: API Gateway CI

on:
  pull_request:
    paths:
      - 'api-gateway/**'
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate self-signed keystore for CI
        run: |
          keytool -genkeypair \
            -alias gateway \
            -keyalg RSA \
            -keysize 2048 \
            -storetype PKCS12 \
            -keystore src/main/resources/keystore.p12 \
            -validity 3650 \
            -dname "CN=localhost, OU=CI, O=Vendify" \
            -storepass "${{ secrets.SSL_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.SSL_KEYSTORE_PASSWORD }}"

      - name: Build and test
        env:
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B verify